<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script>
        // Aplicar el tema lo antes posible para evitar parpadeos (FOUC)
        (function () {
            let theme = 'default';
            try {
                const storedTheme = localStorage.getItem('zenit-theme');
                if (storedTheme) {
                    theme = storedTheme;
                }
            } catch (e) {
                console.warn('[Return] No se pudo leer el tema de localStorage:', e);
            }

            const urlParams = new URLSearchParams(window.location.search);
            const store = urlParams.get('store') || 'none';
            if (store !== 'none') {
                theme = store;
            }
            document.documentElement.className = 'theme-' + theme;
        })();

        // Sincronizar en tiempo real cuando el tema cambie en la ventana principal
        window.addEventListener('storage', (e) => {
            if (e.key === 'zenit-theme' && e.newValue) {
                document.documentElement.className = 'theme-' + e.newValue;
            }
        });
    </script>
    <style>
        @font-face {
            font-family: 'Outfit';
            src: url('public/fonts/outfit-300.ttf') format('truetype'),
                url('fonts/outfit-300.ttf') format('truetype'),
                url('/fonts/outfit-300.ttf') format('truetype');
            font-weight: 300;
            font-style: normal;
        }

        @font-face {
            font-family: 'Outfit';
            src: url('public/fonts/outfit-400.ttf') format('truetype'),
                url('fonts/outfit-400.ttf') format('truetype'),
                url('/fonts/outfit-400.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }

        @font-face {
            font-family: 'Outfit';
            src: url('public/fonts/outfit-600.ttf') format('truetype'),
                url('fonts/outfit-600.ttf') format('truetype'),
                url('/fonts/outfit-600.ttf') format('truetype');
            font-weight: 600;
            font-style: normal;
        }

        @font-face {
            font-family: 'Outfit';
            src: url('public/fonts/outfit-700.ttf') format('truetype'),
                url('fonts/outfit-700.ttf') format('truetype'),
                url('/fonts/outfit-700.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }

        @font-face {
            font-family: 'Antonio';
            src: url('public/fonts/Antonio-Variable.ttf') format('truetype'),
                url('fonts/Antonio-Variable.ttf') format('truetype'),
                url('/fonts/Antonio-Variable.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }

        @font-face {
            font-family: 'Antonio';
            src: url('public/fonts/Antonio-Variable.ttf') format('truetype'),
                url('fonts/Antonio-Variable.ttf') format('truetype'),
                url('/fonts/Antonio-Variable.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }

        :root {
            --primary: #00f2aa;
            --secondary: #007bb0;
            --bg-dark: #1A1A1A;
        }

        /* Themes matching style.css */
        .theme-falabella {
            --primary: #B9D40D;
            --secondary: #8da10a;
        }

        .theme-paris {
            --primary: #00D1FF;
            --secondary: #00A3C7;
        }

        .theme-ripley {
            --primary: #AF47FF;
            --secondary: #FFB800;
        }

        .theme-default {
            --primary: #00f2aa;
            --secondary: #007bb0;
        }

        html {
            background: transparent !important;
            background-color: transparent !important;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
            background: transparent !important;
            background-color: transparent !important;
            font-family: 'Outfit', sans-serif;
            user-select: none;
            box-sizing: border-box;
        }

        .return-btn {
            font-family: 'Antonio', sans-serif;
            background: transparent;
            margin-top: 4px;
            /* Transparent base to eliminate outer gray anti-aliasing halo */
            color: #1A1A1A;
            border: none;
            width: 96%;
            height: 96%;
            padding: 0;
            margin-bottom: auto;
            border-radius: 16px;
            letter-spacing: 2.5px;
            font-weight: 700;
            font-size: 12cqw;
            line-height: 1.1;
            text-transform: uppercase;
            cursor: pointer;
            -webkit-app-region: no-drag;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 4px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 100;
            will-change: transform, filter, opacity;
            transform: translateZ(0);
            overflow: hidden;
            clip-path: inset(0 round 16px);
            isolation: isolate;
        }

        @keyframes rotate-border-transform {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        /* The rotating border beam (Optimized with GPU-accelerated transform rotation) */
        .return-btn::before {
            content: '';
            position: absolute;
            width: 200%;
            height: auto;
            aspect-ratio: 1 / 1;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(0deg);
            background: conic-gradient(
                        #F0F0F0 0%,
                        var(--primary) 10%,
                        var(--secondary) 50%,
                        var(--primary) 90%,
                        #F0F0F0 100%);
            animation: rotate-border-transform 4s linear infinite;
            pointer-events: none;
            z-index: 1;
            will-change: transform;
        }

        /* The solid button background, inset by 2.5px to create a 0.3px overlap that masks the anti-aliasing seam */
        .return-btn::after {
            content: '';
            position: absolute;
            inset: 2.5px;
            background: linear-gradient(50deg, var(--secondary), var(--primary));
            border-radius: 13.5px;
            /* Mathematically concentric to the outer 16px radius (16 - 2.5) */
            pointer-events: none;
            z-index: 2;
        }

        /* NO HOVER EFFECTS */

        .btn-icon,
        .btn-text,
        .brand-logo-container {
            pointer-events: none;
            position: relative;
            z-index: 3;
        }

        .btn-icon {
            opacity: 0.9;
            stroke: #1A1A1A !important;
            width: 20%;
            height: auto;
        }

        .btn-text {
            line-height: 1.2;
            text-align: center;
            max-width: 85%;
            color: #1A1A1A !important;
            font-family: 'Antonio', sans-serif;
        }

        .brand-logo-container {
            display: none;
        }

        .brand-logo-container img {
            max-height: 12cqh;
            opacity: 0.9;
            filter: brightness(0) invert(10.2%);
        }

        .brand-logo-container img.brand-hp {
            max-height: 19cqh;
            /* Aumentado de 16px a 25px para compensar visualmente su forma circular */
        }
    </style>
</head>

<body>
    <button id="restore-btn" class="return-btn">
        <span class="btn-text">VER DETALLES</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-laptop-icon lucide-laptop btn-icon">
            <path
                d="M18 5a2 2 0 0 1 2 2v8.526a2 2 0 0 0 .212.897l1.068 2.127a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45l1.068-2.127A2 2 0 0 0 4 15.526V7a2 2 0 0 1 2-2z" />
            <path d="M20.054 15.987H3.946" />
        </svg>
        <div id="brand-logo-container" class="brand-logo-container">
            <img id="brand-logo-img" src="" alt="" />
        </div>
    </button>

    <script type="module">
        import { invoke } from '@tauri-apps/api/core';
        import { listen } from '@tauri-apps/api/event';

        const btn = document.getElementById('restore-btn');
        const logoContainer = document.getElementById('brand-logo-container');
        const logoImg = document.getElementById('brand-logo-img');
        const validBrands = ['asus', 'hp', 'lenovo', 'acer', 'samsung', 'intel', 'amd', 'nvidia', 'snapdragon'];

        if (logoImg) {
            logoImg.onerror = () => {
                logoImg.className = '';
                if (logoContainer) logoContainer.style.display = 'none';
            };
        }

        // Reset state helper
        const resetState = () => {
            if (btn) btn.classList.remove('is-active');
        };

        // Función global para actualizar el contexto sin recargar la página
        window.setReturnContext = (store, brand) => {
            resetState();

            // Si no se reciben parámetros explícitos, usar localStorage como fallback
            const effectiveStore = (store !== undefined && store !== null) ? store : (localStorage.getItem('zenit-theme') || 'none');
            const effectiveBrand = (brand !== undefined && brand !== null) ? brand : (localStorage.getItem('zenit-brand') || '');

            // Actualizar tema
            const theme = (!effectiveStore || effectiveStore === 'none') ? 'default' : effectiveStore;
            document.documentElement.className = 'theme-' + theme;

            // Actualizar logo
            const b = (effectiveBrand || '').toLowerCase().trim();
            if (b && validBrands.includes(b) && logoImg && logoContainer) {
                logoImg.src = '/assets/logos/' + b + '.svg';
                logoImg.className = 'brand-' + b;
                logoContainer.style.display = 'block';
            } else if (logoContainer) {
                if (logoImg) logoImg.src = '';
                if (logoImg) logoImg.className = '';
                logoContainer.style.display = 'none';
            }
        };

        // Escuchar el evento nativo de Tauri para recibir el contexto de forma segura y tipada
        listen('set-return-context', (event) => {
            if (event && event.payload) {
                const { store, brand } = event.payload;
                window.setReturnContext(store, brand);
            }
        });

        // Escuchar cambios de almacenamiento en tiempo real desde la ventana principal
        window.addEventListener('storage', (e) => {
            if (e.key === 'zenit-theme' || e.key === 'zenit-brand') {
                window.setReturnContext();
            }
        });

        // Soporte fallback para parámetros URL o localStorage al cargar
        const urlParams = new URLSearchParams(window.location.search);
        const urlStore = urlParams.get('store');
        const urlBrand = urlParams.get('brand');
        window.setReturnContext(urlStore, urlBrand);

        // Reset state when window becomes hidden (e.g. app maximized)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) resetState();
        });

        window.addEventListener('focus', resetState);
        window.addEventListener('blur', resetState);

        window.addEventListener('keydown', async (e) => {
            if (e.ctrlKey && e.shiftKey && e.altKey && (e.key === 'r' || e.key === 'R' || e.code === 'KeyR')) {
                e.preventDefault();
                try {
                    await invoke('restart_app');
                } catch (err) {
                    console.error('Failed to restart app from return window:', err);
                }
            }
        });

        // Al presionar el botón (pointerdown), se activa visualmente e inicia la restauración inmediatamente
        if (btn) {
            btn.addEventListener('pointerdown', async () => {
                try {
                    await invoke('restore_app');
                } catch (err) {
                    console.error('Failed to restore app:', err);
                }
            });
        }
    </script>
</body>

</html>
